name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[macos,dev]"
    
    - name: Build app
      run: briefcase build macOS --no-input

    - name: Package DMG
      run: briefcase package macOS --no-input --adhoc-sign --packaging-format dmg

    - name: Package app bundle
      run: |
        ditto -c -k --sequesterRsrc --keepParent \
          build/activitytracker/macos/app/ActivityTracker.app \
          dist/ActivityTracker-${GITHUB_REF_NAME}.app.zip

    - name: Create Release
      run: |
        gh release create "$GITHUB_REF_NAME" \
          dist/ActivityTracker-*.dmg \
          dist/ActivityTracker-*.app.zip \
          --title "ActivityTracker $GITHUB_REF_NAME" \
          --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
