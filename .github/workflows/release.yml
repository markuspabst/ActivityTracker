name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install briefcase
    
    - name: Build app
      run: briefcase build macOS --no-input

    - name: Package DMG
      run: briefcase package macOS --no-input --adhoc-sign --packaging-format dmg

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ActivityTracker-*.dmg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
